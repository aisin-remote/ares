# Ganti dua hostname dan lokasi sertifikat. API/Next harus mendengar di loopback.
limit_req_zone $binary_remote_addr zone=ares_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ares_api:10m rate=20r/s;

server {
    listen 80;
    server_name ares.example.com api.ares.example.com;
    return 301 https://$host$request_uri;
}

# UI Next.js. Route /api/* milik Next tetap masuk ke proses web.
server {
    listen 443 ssl http2;
    server_name ares.example.com;
    ssl_certificate /etc/letsencrypt/live/ares.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ares.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

# Nest API memakai hostname terpisah agar tidak bertabrakan dengan route /api Next.
server {
    listen 443 ssl http2;
    server_name api.ares.example.com;
    ssl_certificate /etc/letsencrypt/live/api.ares.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.ares.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 2m;

    location = /auth/login {
        limit_req zone=ares_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include proxy_params;
    }

    location = /auth/device {
        limit_req zone=ares_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3001;
        include proxy_params;
    }

    location / {
        limit_req zone=ares_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
